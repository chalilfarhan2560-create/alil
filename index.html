<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoalPulse AI - Football Predictor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: #00ff88; margin-bottom: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
        .input-group { margin-bottom: 20px; }
        textarea { width: 100%; height: 120px; background: #1e1e24; color: #fff; border: 1px solid #333; border-radius: 8px; padding: 15px; font-size: 16px; resize: vertical; }
        textarea:focus { outline: none; border-color: #00ff88; }
        button { display: block; width: 100%; background: #00ff88; color: #121212; border: none; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #00cc6a; }
        #loading-indicator { display: none; text-align: center; margin: 20px 0; color: #ffaa00; font-weight: bold; }
        
        /* Dark Sporty Mode Card CSS */
        .match-card { background: #1e1e24; border: 1px solid #333; border-radius: 12px; padding: 20px; margin-bottom: 15px; color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .match-title { text-align: center; font-size: 20px; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .score-prediction { font-size: 32px; font-weight: 800; color: #00ff88; text-align: center; margin: 10px 0; }
        .market-badges { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; flex-wrap: wrap; }
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }
        .badge.winner { background: #ffaa00; color: #000; }
        .badge.ou { background: #0077ff; color: #fff; }
        .badge.hdp { background: #ff3366; color: #fff; }
        .analysis-box { background: #2a2a35; padding: 12px; border-left: 4px solid #00ff88; border-radius: 4px; font-size: 14px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚽ GoalPulse AI</h1>
        <div class="input-group">
            <textarea id="match-input" placeholder="Masukkan daftar pertandingan di sini (Contoh: 1. Mesir vs Malawi...)"></textarea>
        </div>
        <button onclick="startAnalysis()">Mulai Analisa</button>
        
        <div id="loading-indicator">⏳ GoalPulse AI sedang membedah data pertandingan...</div>
        
        <div id="prediction-results"></div>
    </div>

    <script>
        const systemPrompt = `Kamu adalah analis sepak bola profesional. 
Tugasmu memprediksi pertandingan dengan presisi tinggi berdasarkan statistik, H2H, dan kekuatan tim terkini.
WAJIB balas HANYA dalam format JSON yang valid tanpa teks markdown lain, dengan struktur berikut:
{
  "prediksi": [
    {
      "pertandingan": "Tim A vs Tim B",
      "pemenang": "Nama Tim atau Imbang",
      "skor": "X - Y",
      "over_under": "Over 2.5 atau Under 2.5",
      "handicap": "Rekomendasi Asian Handicap (misal: Tim A -1.5)",
      "analisa": "Alasan taktis singkat maksimal 3 kalimat."
    }
  ]
}`;

        async function getPrediction(matchData) {
            // INGAT BANG: Ganti teks di bawah ini dengan API Key OpenRouter Abang yang asli!
            const apiKey = "API_KEY_OPENROUTER_ABANG"; 
            
            document.getElementById('loading-indicator').style.display = 'block';
            document.getElementById('prediction-results').innerHTML = '';

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "google/gemini-flash-1.5",
                        messages: [
                            { "role": "system", "content": systemPrompt },
                            { "role": "user", "content": `Tolong analisa pertandingan ini:\n${matchData}` }
                        ],
                        response_format: { type: "json_object" }
                    })
                });

                const data = await response.json();
                
                if(data.error) {
                    throw new Error(data.error.message || "Gagal menghubungi OpenRouter");
                }

                const hasil = JSON.parse(data.choices[0].message.content);
                
                document.getElementById('loading-indicator').style.display = 'none';
                renderPredictionUI(hasil.prediksi);

            } catch (error) {
                console.error("API error Bang:", error);
                document.getElementById('loading-indicator').style.display = 'block';
                document.getElementById('loading-indicator').style.color = '#ff3366';
                document.getElementById('loading-indicator').innerHTML = `⚠️ Gagal memuat prediksi: ${error.message}. Cek koneksi atau API Key.`;
            }
        }

        function renderPredictionUI(prediksiArray) {
            const container = document.getElementById('prediction-results');
            container.innerHTML = ''; 

            prediksiArray.forEach(item => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerHTML = `
                    <h3 class="match-title">${item.pertandingan}</h3>
                    <div class="score-prediction">${item.skor}</div>
                    
                    <div class="market-badges">
                        <span class="badge winner">🏆 ${item.pemenang}</span>
                        <span class="badge ou">⚽ ${item.over_under}</span>
                        <span class="badge hdp">📈 ${item.handicap}</span>
                    </div>
                    
                    <div class="analysis-box">
                        <p><strong>Bedah Taktik:</strong> ${item.analisa}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function startAnalysis() {
            const matchData = document.getElementById('match-input').value;
            if (!matchData.trim()) {
                alert('Bang, masukin dulu jadwal pertandingannya!');
                return;
            }
            document.getElementById('loading-indicator').style.color = '#ffaa00';
            document.getElementById('loading-indicator').innerHTML = '⏳ GoalPulse AI sedang membedah data pertandingan...';
            getPrediction(matchData);
        }
    </script>
</body>
</html>
